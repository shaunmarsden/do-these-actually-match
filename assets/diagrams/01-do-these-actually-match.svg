<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-labelledby="title"><title id="title">Four outcomes from comparing two records</title><style>:root{--i:#183b56;--l:#607080;--g:#e8f5ed;--a:#fff4dd;--n:#eef2f6}@media(prefers-color-scheme:dark){:root{--i:#e6edf3;--l:#9baabd;--g:#183b2a;--a:#4a3610;--n:#263444}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--i)}.x{stroke:var(--l);stroke-width:3;rx:16}.t{font-size:17px;font-weight:700}.s{font-size:13px}</style><rect class="x" x="100" y="55" width="160" height="110" fill="var(--g)"/><rect class="x" x="275" y="55" width="160" height="110" fill="var(--a)"/><rect class="x" x="450" y="55" width="160" height="110" fill="var(--n)"/><rect class="x" x="625" y="55" width="160" height="110" fill="var(--a)"/><text class="t" x="180" y="102" text-anchor="middle">Agrees</text><text class="s" x="180" y="139" text-anchor="middle">Same fact, resolved</text><text class="t" x="355" y="91" text-anchor="middle">Genuinely</text><text class="t" x="355" y="112" text-anchor="middle">conflicting</text><text class="s" x="355" y="139" text-anchor="middle">A real disagreement</text><text class="t" x="530" y="91" text-anchor="middle">Only in one</text><text class="t" x="530" y="112" text-anchor="middle">record</text><text class="s" x="530" y="139" text-anchor="middle">Not found in the other</text><text class="t" x="705" y="80" text-anchor="middle">Could not</text><text class="t" x="705" y="101" text-anchor="middle">confidently</text><text class="t" x="705" y="122" text-anchor="middle">match</text><text class="s" x="705" y="148" text-anchor="middle">Too uncertain to decide</text></svg>
